# Тесты запускаются на каждый push и pull request.
# PostgreSQL не нужен (тесты работают с in-memory репозиториями), Redis нужен для rate limiting.
name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    # .env в git нет, поэтому настройки задаём здесь.
    env:
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql://sirius:sirius@localhost:5432/sirius_food
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
